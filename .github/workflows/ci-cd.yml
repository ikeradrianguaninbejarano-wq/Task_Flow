name: Validate and deploy TaskFlow

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: HTML, accessibility, security, and responsive tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run HTML and browser tests
        run: npm test

  deploy:
    name: Deploy to GitHub Pages
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html style.css app.js db.js manifest.json sw.js _site/
          touch _site/.nojekyll
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
